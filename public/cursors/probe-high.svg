<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The same logic probe reading HIGH over anything clickable: the body
       turns signal amber and the status LED burns white-hot with a glow. -->
  <g transform="translate(3.1 3.3) rotate(-45) scale(1.15)" fill="#000" fill-opacity="0.3">
    <path d="M0 0 L2.7 9 H-2.7 Z"/>
    <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5"/>
  </g>
  <g transform="translate(2 2) rotate(-45) scale(1.15)" stroke-linejoin="round">
    <!-- Dark rim, so the amber probe reads on the light theme -->
    <g fill="none" stroke="#0E0F12" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 0 L1.35 6.5 L2.7 9 H-2.7 L-1.35 6.5 Z"/>
      <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5"/>
      <path d="M0 28 C0 29.9 0.8 30.7 2.3 31.3"/>
    </g>
    <path d="M0 28 C0 29.9 0.8 30.7 2.3 31.3" fill="none" stroke="#FF8A3D" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M0 0 L1.35 6.5 H-1.35 Z" fill="#E4E8EE" stroke="#0E0F12" stroke-width="0.7"/>
    <path d="M-1.35 6.5 H1.35 L2.7 9 H-2.7 Z" fill="#C75B14"/>
    <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5" fill="#FF8A3D"/>
    <circle cx="0" cy="13.25" r="3.4" fill="#FFF1E2" fill-opacity="0.45"/>
    <rect x="-1.65" y="11.6" width="3.3" height="3.3" rx="0.6" fill="#FFF8F0"/>
    <path d="M-2.3 19.2 H2.3 M-2.3 21.6 H2.3 M-2.3 24 H2.3" stroke="#0E0F12" stroke-opacity="0.35" stroke-width="0.8"/>
  </g>
</svg>
