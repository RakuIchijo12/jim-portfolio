<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- A logic probe reading LOW: silver needle (the hotspot, at 2 2), a dark
       body with grip ridges, its status LED and a short lead. Drawn pointing
       down its own axis, then turned to the usual pointer angle. -->
  <g transform="translate(3.1 3.3) rotate(-45) scale(1.15)" fill="#000" fill-opacity="0.3">
    <path d="M0 0 L2.7 9 H-2.7 Z"/>
    <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5"/>
  </g>
  <g transform="translate(2 2) rotate(-45) scale(1.15)" stroke-linejoin="round">
    <!-- Light rim, so the probe reads on the dark theme -->
    <g fill="none" stroke="#F2F3F5" stroke-width="2.4" stroke-linecap="round">
      <path d="M0 0 L1.35 6.5 L2.7 9 H-2.7 L-1.35 6.5 Z"/>
      <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5"/>
      <path d="M0 28 C0 29.9 0.8 30.7 2.3 31.3"/>
    </g>
    <path d="M0 28 C0 29.9 0.8 30.7 2.3 31.3" fill="none" stroke="#0E0F12" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M0 0 L1.35 6.5 H-1.35 Z" fill="#C3C9D2" stroke="#0E0F12" stroke-width="0.7"/>
    <path d="M-1.35 6.5 H1.35 L2.7 9 H-2.7 Z" fill="#3A3F47"/>
    <rect x="-3.7" y="9" width="7.4" height="19" rx="2.5" fill="#0E0F12"/>
    <rect x="-1.65" y="11.6" width="3.3" height="3.3" rx="0.6" fill="#FF8A3D"/>
    <path d="M-2.3 19.2 H2.3 M-2.3 21.6 H2.3 M-2.3 24 H2.3" stroke="#F2F3F5" stroke-opacity="0.3" stroke-width="0.8"/>
  </g>
</svg>
