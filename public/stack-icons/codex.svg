<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="cg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B4C0FB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Cloud body: rect base + three bumps on top -->
  <rect x="8" y="26" width="32" height="16" rx="6" fill="url(#cg)"/>
